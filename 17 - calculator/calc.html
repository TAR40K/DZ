<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Калькулятор</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="calculator">
      <h1>Калькулятор</h1>

      <div class="input-group">
        <label for="num1">Число 1</label>
        <input type="number" id="num1" placeholder="Введите число" />
      </div>

      <div class="input-group">
        <label for="num2">Число 2</label>
        <input type="number" id="num2" placeholder="Введите число" />
      </div>

      <div class="buttons">
        <button class="btn" data-action="add">➕ Сложение</button>
        <button class="btn" data-action="subtract">➖ Вычитание</button>
        <button class="btn" data-action="multiply">✖️ Умножение</button>
        <button class="btn" data-action="divide">➗ Деление</button>
      </div>

      <div class="result">
        <span id="resultText">0</span>
      </div>
    </div>

    <script src="app.js"></script>
  </body>
</html>
