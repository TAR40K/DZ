<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Calculator</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body style="background-color: #1c1b21; text-align: center">
    <div class="calcPanel">
      <div class="inPanels">
        <input type="number" class="input input_left" />
        <input type="number" class="input input_right" />
      </div>
      <div class="buttonsPanel">
        <button class="button button_plus">+</button>
        <button class="button button_minus">-</button>
        <button class="button button_divide">/</button>
        <button class="button button_multiply">x</button>
      </div>
      <input type="number" class="output" readonly />
    </div>
    <script src="./calc.js"></script>
  </body>
</html>
